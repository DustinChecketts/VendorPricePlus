# StormCore validation pilot. After approval, pin to a reviewed StormCore commit on main.
name: StormCore quality checks

on:
  workflow_dispatch:
  push:
    branches:
      - feature/stormcore-shared-validation

permissions:
  contents: read

jobs:
  quality:
    uses: DustinChecketts/stormcore/.github/workflows/validate-addon.yml@feature/addon-local-quality-config
    with:
      strict: false
