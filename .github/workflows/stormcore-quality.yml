# Shared addon quality checks, pinned to a reviewed StormCore commit.
# Advisory lint and formatting findings do not block existing development.
name: StormCore quality checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    uses: DustinChecketts/stormcore/.github/workflows/validate-addon.yml@80696280b69b2c4d71c56b40f0950dc60fb4d27b
    with:
      strict: false
