# StormCore validation pilot pinned to a reviewed immutable StormCore commit.
# The shared workflow checks out its scripts from that same commit.
name: StormCore quality checks

on:
  workflow_dispatch:
  push:
    branches:
      - feature/stormcore-shared-validation

permissions:
  contents: read

jobs:
  quality:
    uses: DustinChecketts/stormcore/.github/workflows/validate-addon.yml@80696280b69b2c4d71c56b40f0950dc60fb4d27b
    with:
      strict: false
